<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重生點與頁尾：版面實驗</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@700;900&family=Chiron+Hei+HK:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The last scene of the home page and the foot of the site, as one composition.
         The scene is the film's last frame: the call, and the mascot beside it. Nothing else stands on the picture.
         Under it the picture sinks into the ground, as an inner page's header does, and on the ground stand the
         departments and the site's map, on one grid of three columns from gutter to gutter. */
      :root {
        --bg: #06080b;
        --fg: #f2f4f6;
        --muted: #a3adb8;
        --line: rgba(242, 244, 246, 0.18);
        --accent: #86cdff;
        --v: 6, 8, 11;
        --logo: invert(1);
        --serif: 'Chiron Sung HK', 'Noto Serif TC', serif;
        --sans: 'Chiron Hei HK', 'Noto Sans TC', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
        --gutter: clamp(20px, 6vw, 96px);
        --s1: 0.92;
        --s2: 0.7;
        --s3: 0.2;
        --s4: 0.32;
        --col-gap: clamp(32px, 4vw, 72px);
      }
      [data-theme='light'] {
        --bg: #eef2f5;
        --fg: #0f1418;
        --muted: #414c57;
        --line: rgba(15, 20, 24, 0.2);
        --accent: #0b6fb5;
        --v: 238, 242, 245;
        --logo: none;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        line-height: 1.8;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }
      .mono {
        font-family: var(--mono);
      }
      .serif {
        font-family: var(--serif);
        font-weight: 900;
      }

      /* the picture, fixed behind the scene as on the home page */
      .world {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      .world img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .world::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(var(--v), var(--s1)) 0%,
          rgba(var(--v), var(--s2)) 40%,
          rgba(var(--v), var(--s3)) 72%,
          rgba(var(--v), var(--s4)) 100%
        );
      }
      [data-theme='light'] .world::after {
        background: linear-gradient(
          90deg,
          rgba(var(--v), 0.97) 0%,
          rgba(var(--v), 0.94) 36%,
          rgba(var(--v), 0.3) 54%,
          rgba(var(--v), 0) 72%
        );
      }

      .bar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 5;
        height: 72px;
        padding: 0 var(--gutter);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        color: var(--muted);
      }
      .bar img {
        height: 26px;
        filter: var(--logo);
      }
      .bar button {
        font: inherit;
        color: var(--fg);
        background: none;
        border: 1px solid var(--line);
        border-radius: 100px;
        padding: 8px 16px;
        cursor: pointer;
      }

      main {
        position: relative;
        z-index: 1;
      }
      .before {
        height: 60vh;
      }

      /* ── the scene: the call, and the mascot beside it ── */
      /* The scene is the call to join, whole: what to do, the mascot beside it, and under them the three
         departments, each with its own way in. Two columns for the call and the mascot; the departments run under
         both, from gutter to gutter. */
      .call {
        min-height: 100vh;
        padding: 16vh var(--gutter) 14vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        align-content: center;
        gap: 72px var(--gutter);
      }
      .call .label {
        font-size: 12px;
        color: var(--accent);
      }
      .call h2 {
        font-size: clamp(40px, 6vw, 108px);
        line-height: 1.14;
        margin: 18px 0 44px;
      }
      /* the title breaks where the sentence does */
      .call h2 span {
        display: block;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-weight: 700;
        font-size: 17px;
        padding: 18px 30px;
        background: var(--fg);
        color: var(--bg);
        border-radius: 100px;
        transition:
          background 0.3s,
          gap 0.3s;
      }
      .btn:hover {
        background: var(--accent);
        gap: 22px;
      }
      .more {
        display: inline-flex;
        gap: 10px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--line);
        line-height: 1.5;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 500;
        transition:
          gap 0.3s,
          border-color 0.3s;
      }
      .more:hover {
        gap: 16px;
        border-bottom-color: var(--accent);
      }
      .pal {
        width: min(28vw, 400px);
        height: auto;
        filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.45));
      }

      /* ── the ground: the picture sinks into it, as an inner page's header does ── */
      .ground {
        background: linear-gradient(
          180deg,
          rgba(var(--v), 0) 0,
          rgba(var(--v), 0.86) 110px,
          rgb(var(--v)) 200px
        );
        padding: 180px var(--gutter) 0;
      }
      /* one grid for everything on the ground: three columns from gutter to gutter */
      .cols {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: var(--col-gap);
      }

      /* The departments: a list, one row each. The name at one end, the way in at the other, what the department
         looks for between them; the rule over each row runs from gutter to gutter. */
      .depts {
        grid-column: 1 / -1;
      }
      .depts li {
        display: grid;
        grid-template-columns: 8em minmax(0, 1fr) auto;
        column-gap: 32px;
        align-items: baseline;
        border-top: 1px solid var(--line);
        padding: 22px 0;
      }
      .depts li:last-child {
        border-bottom: 1px solid var(--line);
      }
      .depts b {
        font: 900 24px/1.3 var(--serif);
      }
      .depts span {
        color: var(--muted);
      }

      /* The site's map. The mark at one edge, large enough to carry that side by itself; the three lists at the
         other, each as wide as its longest word, with one space between them. The two edges are the gutters, as
         for everything above; between them the footer is sized by what it holds, so no language squeezes it. */
      .foot {
        border-top: 1px solid var(--line);
        padding: 56px 0 64px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 48px var(--col-gap);
        font-size: 14px;
      }
      .brand {
        display: grid;
        gap: 20px;
        justify-items: start;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .brand img {
        height: clamp(40px, 4.4vw, 64px);
        filter: var(--logo);
      }
      .site {
        display: flex;
        gap: var(--col-gap);
      }
      .map {
        display: flex;
        gap: var(--col-gap);
      }
      .foot nav {
        display: grid;
        align-content: start;
        justify-items: start;
        gap: 8px;
        white-space: nowrap;
      }
      .foot .label {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .foot nav a {
        transition: color 0.3s;
      }
      .foot nav a:hover {
        color: var(--accent);
      }
      /* the community: marks, not words. Each is a round control a finger can hit, in the bar's own pill language */
      .icons {
        display: flex;
        gap: 10px;
        margin: 2px 0 8px;
      }
      .foot .icons a {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        font-size: 19px;
        transition:
          color 0.3s,
          border-color 0.3s;
      }
      .foot .icons a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* ── 861–1100px: the same frame, a smaller mascot, a narrower name column ── */
      @media (max-width: 1100px) {
        .pal {
          width: min(26vw, 300px);
        }
        .call {
          row-gap: 56px;
        }
        .depts li {
          grid-template-columns: 6em minmax(0, 1fr) auto;
          column-gap: 24px;
        }
      }

      /* ── up to 860px: one column; the veil runs bottom-up; no room for the mascot;
            a department is its name, what it looks for, and its way in, one under another ── */
      @media (max-width: 860px) {
        .world::after,
        [data-theme='light'] .world::after {
          background: linear-gradient(
            0deg,
            rgba(var(--v), 0.9) 0%,
            rgba(var(--v), 0.62) 55%,
            rgba(var(--v), 0.3) 100%
          );
        }
        .call {
          grid-template-columns: minmax(0, 1fr);
          padding-top: 112px;
          padding-bottom: 10vh;
          row-gap: 48px;
        }
        .pal {
          display: none;
        }
        .call h2 {
          margin-bottom: 32px;
        }
        .depts li {
          grid-template-columns: minmax(0, 1fr);
          row-gap: 6px;
          padding: 20px 0 12px;
        }
        .depts .more {
          justify-self: start;
          min-height: 44px;
          align-items: center;
        }
        .ground {
          padding-top: 140px;
        }
        /* the lists first: two side by side, the community under them; the mark and the rights at the foot */
        .foot {
          padding: 40px 0;
          gap: 40px;
        }
        .map {
          order: -1;
          width: 100%;
          flex-direction: column;
          gap: 32px;
        }
        .site {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 24px;
        }
        .foot nav {
          gap: 0;
        }
        .foot nav > a {
          min-height: 44px;
          display: inline-flex;
          align-items: center;
        }
        .brand {
          white-space: normal;
        }
      }
      /* ── a phone on its side: the scene is as tall as what it holds ── */
      @media (max-height: 480px) {
        .call {
          min-height: 0;
          padding-top: 88px;
          padding-bottom: 32px;
        }
        .pal {
          display: none;
        }
      }
    </style>
  </head>
