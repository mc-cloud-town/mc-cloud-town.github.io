<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>載入畫面實驗｜雲鎮工藝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@700;900&family=Chiron+Hei+HK:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Loader experiment. Inspired by the world-generation map of the game: chunks pass through
         stages from the centre outward and settle into a finished square. Drawn in code, in the
         site's own palette; no game image is used. */
      :root {
        --bg: #06080b;
        --fg: #f2f4f6;
        --muted: #a3adb8;
        --accent: #86cdff;
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Chiron Hei HK', system-ui, sans-serif;
        --serif: 'Chiron Sung HK', serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: #111;
        color: var(--fg);
        font-family: var(--sans);
        overflow: hidden;
      }
      .scene {
        position: fixed;
        inset: 0;
        background: url('../../public/assets/members/CTEC_Members.webp') center /
          cover;
        transform-origin: 50% 50%;
      }
      .scene::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(6, 8, 11, 0.82),
          rgba(6, 8, 11, 0.2) 60%
        );
      }
      .title {
        position: fixed;
        right: 6vw;
        top: 50%;
        transform: translateY(-50%);
        writing-mode: vertical-rl;
        font: 900 clamp(56px, 13vh, 150px) / 1.05 var(--serif);
        letter-spacing: 0.04em;
      }
      .loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--bg);
        display: grid;
        place-items: center;
      }
      .loader-in {
        display: grid;
        justify-items: center;
        gap: 22px;
      }
      .pct {
        font: 500 15px var(--mono);
        letter-spacing: 0.08em;
        color: var(--fg);
        min-width: 4ch;
        text-align: center;
      }
      canvas {
        width: min(46vmin, 300px);
        aspect-ratio: 1;
        image-rendering: pixelated;
        display: block;
      }
      .stage {
        font: 12px var(--mono);
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      .panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 20;
        display: flex;
        gap: 10px;
        align-items: center;
        font: 12px var(--mono);
        color: var(--muted);
        background: rgba(6, 8, 11, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        padding: 8px 14px;
      }
      .panel button,
      .panel select {
        font: inherit;
        color: var(--fg);
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .panel option {
        color: #000;
      }
    </style>
  </head>
  <body>
    <div class="scene" id="scene"></div>
    <div class="title" id="title">雲鎮工藝</div>

    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader-in" id="in">
        <div class="pct" id="pct">0%</div>
        <canvas id="map" width="21" height="21"></canvas>
        <div class="stage" id="stage">正在建置地形</div>
      </div>
    </div>

    <div class="panel">
      <button id="replay">重播</button>
      <label
        >等待資源
        <select id="wait">
          <option value="0">不用等</option>
          <option value="1500" selected>1.5 秒</option>
          <option value="4000">4 秒（慢網路）</option>
        </select></label
      >
      <label
        >前緣顏色
        <select id="ring">
          <option value="#86cdff" selected>主世界藍</option>
          <option value="#5fd35f">原版綠</option>
        </select></label
      >
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const N = 21,
        C = (N - 1) / 2,
        R = 8; // the finished map is a (2R+1) square inside an N grid
      const cv = document.getElementById('map'),
        ctx = cv.getContext('2d');
      const $ = (s) => document.querySelector(s);
      // per-chunk lateness: what makes the fronts ragged while loading and square when done
      let late = [];
      const seed = () => {
        late = Array.from({ length: N * N }, () => Math.random());
      };
      // stages a chunk passes through, oldest first; the last one is "done"
      const tones = () => [
        '#0d1217',
        '#39424c',
        '#6f7984',
        '#9aa3ad',
        $('#ring').value,
        '#f2f4f6',
      ];
      const FRONTS = [0, 0.16, 0.3, 0.42, 0.5]; // how far behind the leading front each stage follows

      function draw(p) {
        const t = tones();
        ctx.fillStyle = '#06080b';
        ctx.fillRect(0, 0, N, N);
        for (let y = 0; y < N; y++)
          for (let x = 0; x < N; x++) {
            const d = Math.max(Math.abs(x - C), Math.abs(y - C));
            if (d > R + 2) continue;
            // the outer two rings never finish: they stay at the first grey, like the border of the map
            const reach = d / (R + 2);
            const jitter = late[y * N + x] * 0.16 * (1 - p); // raggedness dies out as it completes
            let stage = -1;
            for (let s = 0; s < FRONTS.length; s++)
              if (p * 1.5 - FRONTS[s] - jitter > reach) stage = s;
            if (stage < 0) continue;
            const cap = d > R ? 1 : d === R ? 4 : 5; // border: grey; edge: ring colour; inside: done
            let k = Math.min(stage + 1, cap);
            // the ring is only ever one chunk wide: behind it chunks are done
            if (k === 4 && d < R && p * 1.5 - FRONTS[4] - jitter > reach + 0.08)
              k = 5;
            if (k === 5 && d === R) k = 4;
            ctx.fillStyle = t[k];
            ctx.fillRect(x, y, 1, 1);
          }
      }

      let tl;
      function run() {
        tl && tl.kill();
        seed();
        const wait = +$('#wait').value;
        const st = { p: 0 };
        const paint = () => {
          draw(st.p);
          $('#pct').textContent = Math.round(st.p * 100) + '%';
        };
        gsap.set('#loader', { autoAlpha: 1 });
        gsap.set('#in', { opacity: 1, scale: 1 });
        gsap.set('#scene', { scale: 1.3 });
        gsap.set('#title', { opacity: 0, yPercent: -44 });
        $('#stage').textContent = '正在建置地形';
        paint();
        tl = gsap
          .timeline()
          // the map builds most of the way on its own…
          .to(st, {
            p: 0.82,
            duration: 1.5,
            ease: 'power1.inOut',
            onUpdate: paint,
          })
          // …then creeps while the real resources arrive, so it never looks frozen
          .call(() => wait > 600 && ($('#stage').textContent = '正在進入世界'))
          .to(st, {
            p: 0.95,
            duration: wait / 1000,
            ease: 'power1.out',
            onUpdate: paint,
          })
          .to(st, { p: 1, duration: 0.35, ease: 'power2.out', onUpdate: paint })
          // finished square holds for a beat, then the map opens onto the world
          .to(
            '#in',
            { opacity: 0, scale: 1.6, duration: 0.6, ease: 'power3.in' },
            '+=0.18',
          )
          .to(
            '#loader',
            { autoAlpha: 0, duration: 0.9, ease: 'power2.out' },
            '-=.1',
          )
          .to('#scene', { scale: 1, duration: 2.6, ease: 'expo.out' }, '<')
          .to(
            '#title',
            { opacity: 1, yPercent: -50, duration: 1.3, ease: 'expo.out' },
            '<.2',
          );
      }
      $('#replay').onclick = run;
      $('#wait').onchange = run;
      $('#ring').onchange = run;
      run();
    </script>
  </body>
</html>
